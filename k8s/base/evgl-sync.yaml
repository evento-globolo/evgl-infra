apiVersion: apps/v1
kind: Deployment
metadata:
  name: evgl-sync
  namespace: evgl
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: evgl-sync }
  template:
    metadata:
      labels: { app.kubernetes.io/name: evgl-sync }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/evento-globolo/evgl-sync:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: BIND_ADDR, value: 0.0.0.0:8080 }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: evgl-sync
  namespace: evgl
spec:
  selector: { app.kubernetes.io/name: evgl-sync }
  ports: [{ name: http, port: 80, targetPort: http }]
